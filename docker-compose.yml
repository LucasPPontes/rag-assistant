version: '3.8'

services:
  # ======================================================
  # 1. MinIO - Object Storage S3 para armazenamento dos PDFs
  # ======================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # MinIO Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ======================================================
  # 2. Init Container para criar o bucket automaticamente
  # ======================================================
  createbuckets:
    image: minio/mc:latest
    container_name: createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do echo 'Aguardando MinIO iniciar...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/rag-bucket;
      /usr/bin/mc anonymous set download myminio/rag-bucket;
      echo 'Bucket rag-bucket criado com sucesso!';
      exit 0;
      "
    networks:
      - rag_network

  # ======================================================
  # 3. Backend - FastAPI com ChromaDB Embutido
  # ======================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8001:8001"   # Porta 8001 para o FastAPI
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ======================================================
  # 4. Frontend - Streamlit Chatbot UI
  # ======================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  minio_data:
  chroma_data:
